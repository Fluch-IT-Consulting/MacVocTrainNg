# Checks every pull request and every push to main (#13, #191). One job, `test`, the
# check branch protection requires:
#
# - lints with swift-format like the local check before a pull request,
# - builds the app and runs all tests, core and app, with warnings as errors,
# - builds the iPhone app and runs its tests in the simulator, also with warnings as
#   errors (#254),
# - checks the String Catalog: every key in either app is in it, every key has a
#   complete German translation (Tools/check-localizations.swift),
# - builds the Release configuration for Apple Silicon and Intel with
#   `Tools/make-release.sh --build-only`, also with warnings as errors, but without
#   signing and disk image.
#
# Branch protection doesn't require an up-to-date branch, so the run on main checks
# what the rebase merge actually produced.
#
# Xcode is pinned to the version the project is developed with: a newer swift-format
# may judge the same code differently, and the check would fail without a change. The
# pull request that raises it also fixes new warnings, such as deprecations, and adapts
# the localization check if Xcode changed the .stringsdata format.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request makes the running check obsolete; on main the
# later merge checks the same and more.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: |
          xcrun swift-format lint --strict -r MacVocTrainNg MacVocTrainNgTests VocTrain VocTrainTests Shared \
            Packages/VocabCore/Sources Packages/VocabCore/Tests Packages/VocabCore/Package.swift Tools

      # Signed ad hoc (Config/Signing.xcconfig): the runner has no certificate.
      # Runs after a failed lint too, so one push reports everything. Warnings are
      # errors only here; locally they stay warnings.
      - name: Build and test
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project MacVocTrainNg.xcodeproj -scheme MacVocTrainNg \
            -destination platform=macOS -derivedDataPath build/DerivedData \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test

      # On an iPhone simulator of the newest iOS this Xcode brings; the runner has
      # several. Into the same DerivedData, so the next step checks both apps.
      - name: Build and test iPhone app
        if: ${{ !cancelled() }}
        run: |
          simulator=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $version
              | .value[] | select(.name | startswith("iPhone")) | {version: $version, udid}]
            | sort_by(.version) | last | .udid // empty')
          if [ -z "$simulator" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          xcodebuild -project MacVocTrainNg.xcodeproj -scheme VocTrain \
            -destination "id=$simulator" -derivedDataPath build/DerivedData \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test

      # Reads the keys the builds above extracted into build/DerivedData.
      - name: Check translations
        if: ${{ !cancelled() }}
        run: swift Tools/check-localizations.swift build/DerivedData

      # Whole module, without DEBUG, both architectures, with the settings the release
      # uses; stops before signing and the disk image.
      - name: Build release
        if: ${{ !cancelled() }}
        run: Tools/make-release.sh --build-only
